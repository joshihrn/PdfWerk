name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Fonts first: PDFsharp ships none and has no default resolver on Linux, so every
      # rendering test would fail on a bare runner without them.
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-liberation

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Build web and embed
        working-directory: web
        run: |
          npm ci
          npm run build:all

  e2e:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-liberation

      # The suite drives the real API, which serves the built SPA from wwwroot — so the
      # frontend has to be built and embedded before the server is worth starting.
      - name: Build web and embed
        working-directory: web
        run: |
          npm ci
          npm run build:all

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # playwright.config.ts starts the API itself and waits on /health.
      - name: Run end-to-end tests
        working-directory: e2e
        run: npm test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/.artifacts
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v5

      # Proves the image still builds, including the LibreOffice and font layers. Not pushed.
      - name: Build image
        run: docker build -t pdfwerk:ci .
